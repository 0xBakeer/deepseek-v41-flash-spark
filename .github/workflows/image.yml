# Build the serving image on GitHub's arm64 runner and publish it to GHCR.
#
# arm64 is not a preference: the wheels this image installs (torch 2.13.0+cu130 and the
# triton that comes with it) are aarch64 builds, and the box it runs on is a GB10. There
# is no x86 variant of this recipe to build, so there is no manifest list either.
#
# Fires on a version tag (v0.1.0 -> :0.1.0 and :latest) and on demand. A manual run tags
# <VERSION>-<short sha> and never touches :latest, so the moving tag only ever points at
# something that was released.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The CUDA 13 devel base is ~9 GB unpacked and the torch wheel set is another few;
      # a stock runner has enough only after the preinstalled toolchains are gone.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Resolve version and image name
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          # GHCR namespaces are lowercase; the GitHub owner may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepseek-v41-flash-spark" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            RECIPE_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.release == 'true' && format('{0}:latest', steps.v.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What was published
        run: |
          echo "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
